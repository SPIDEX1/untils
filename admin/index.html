<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Review Portal | UNTILS</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#eef5ff;color:#12233d}
.w{max-width:1000px;margin:0 auto;padding:16px}.c{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(20,90,170,.12);margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid #d5e3f5;max-width:100%}
textarea,input[type=email],input[type=text]{width:100%}button{cursor:pointer;background:#0a6cff;color:#fff;border:0;font-weight:700}button.g{background:#e3eefc;color:#12233d}
button.ok{background:#1fa24a}button.no{background:#e0334c}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.it{display:flex;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;background:#f2f8ff;margin:8px 0;cursor:pointer;align-items:center}
.b{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:#ffe9b8}.b.approved{background:#c9f5d3}.b.live{background:#b7e4ff}.b.rejected{background:#ffd0d6}
.err{color:#d0213a;font-weight:700;min-height:1.2em}.m{color:#6b7c93;font-size:14px}[hidden]{display:none!important}
.fr{display:block;margin:10px auto;border:3px solid #12233d;border-radius:14px;background:#000;width:100%;height:70vh}.fr.ph{width:375px;max-width:100%;height:667px;max-height:75vh}
.rv{border-left:4px solid #0a6cff;padding:6px 10px;margin:8px 0;background:#f7faff}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:10px}.dc{background:#f7faff;border-radius:14px;padding:14px;border:2px solid #e3eefc}.dc h3{margin:0 0 4px}.dp{min-height:60px}.dp img,.dp video{max-width:100%;max-height:200px;border-radius:10px;display:block;margin:8px 0;background:#000}.dp img{background:#fff;border:1px solid #d5e3f5}.dc input[type=file]{width:100%;border:2px dashed #b9cfee;background:#fff}.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}.st{background:#fff;border:1px solid #d5e3f5;border-radius:10px;padding:6px;display:grid;gap:6px}.st img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000}.st button{padding:6px 8px;font-size:13px}.dc .ok2{color:#14803c;font-weight:700;min-height:1.2em}
.ac{grid-column:auto}.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:8px 0}.ag .st{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid #d5e3f5;border-radius:12px;padding:8px}.ag .st img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#eef5ff}.ag .st b{font-size:14px;overflow-wrap:anywhere}.af{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;background:#fff;border:2px dashed #b9cfee;border-radius:14px}.af input[type=text]{width:100%;box-sizing:border-box}.af .dp img{max-height:160px}
.b.lead{cursor:pointer;background:#cfe3ff}.b.lead:hover{background:#b9d7ff}
button.sv:disabled{background:#cfd8e6;color:#8795aa;opacity:1;cursor:not-allowed}
.lk{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(238,245,255,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.lkc{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:360px;box-shadow:0 12px 36px rgba(20,90,170,.25)}.lkc.bare{background:none;box-shadow:none;max-width:none;width:auto}
.lkc h2{margin:0 0 6px}.lkc .m{margin:0 0 12px}.lkc .row button{flex:1 1 110px}
.pd{position:relative;display:flex;align-items:center;height:56px;padding:0 16px;margin:6px 0;border:2px solid #cfe0f5;border-radius:14px;background:#fff;overflow:hidden;font-size:22px;line-height:1}
.pd:focus-within{border-color:#0a6cff}.pd input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px}
.pds{letter-spacing:5px;white-space:nowrap;color:#12233d}.pdp{color:#9aa9bd;font-size:16px;letter-spacing:0}.pdc{display:none;width:2px;height:26px;margin-left:2px;background:#0a6cff;animation:pdb 1s steps(1) infinite}.pd:focus-within .pdc{display:inline-block}
@keyframes pdb{50%{opacity:0}}
</style><link rel="stylesheet" href="/assets/css/loader.css?v=1"></head><body><div class="w">
<div class="c"><h1>UNTILS Review Portal</h1><div class="row" id="bar" hidden><span id="who" class="m"></span><span class="b" id="role" title="Click for options"></span><button class="g" id="out">Log out</button></div><div class="row" id="rm" hidden><button class="g" id="rmSet">🔒 Set code</button></div><div class="m" id="rmMsg" hidden></div></div>
<div class="c" id="login"><h2>Staff sign in</h2><div id="s1"><input type="email" id="em" placeholder="Your email"><div class="row"><button id="send">SEND CODE</button></div></div>
<div id="s2" hidden><p class="m">Enter the code sent to your email.</p><input type="text" id="cd" inputmode="numeric" maxlength="10" placeholder="Code"><div class="row"><button id="ver">VERIFY</button></div></div><div class="err" id="le"></div></div>
<div class="c" id="deny" hidden><h2>No access</h2><p>This account is not on the review team. Ask the leader to add your email.</p></div>
<div id="app" hidden><div class="c"><div class="row"><button class="g" data-t="pending">Pending</button><button class="g" data-t="done">Decided</button><button class="g" data-t="team" id="tt" hidden>Team</button><button class="g" data-t="demo" id="td" hidden>Docs demo</button></div><div id="list"></div></div>
<div class="c" id="det" hidden></div></div>
</div><div class="lk" id="lk"><div class="lkc bare" id="lkc"></div></div><script src="/assets/js/auth.js?v=8"></script><script src="/assets/js/loader.js?v=1"></script><script src="/assets/js/admin.v10.js"></script></body></html>
