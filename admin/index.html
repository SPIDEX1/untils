<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Review Portal | UNTILS</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#eef5ff;color:#12233d}
.w{max-width:1000px;margin:0 auto;padding:16px}.c{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(20,90,170,.12);margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid #d5e3f5;max-width:100%}
textarea,input[type=email],input[type=text]{width:100%}button{cursor:pointer;background:#0a6cff;color:#fff;border:0;font-weight:700}button.g{background:#e3eefc;color:#12233d}
button.ok{background:#1fa24a}button.no{background:#e0334c}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.it{display:flex;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;background:#f2f8ff;margin:8px 0;cursor:pointer;align-items:center}
.b{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;background:#ffe9b8}.b.approved{background:#c9f5d3}.b.live{background:#b7e4ff}.b.rejected{background:#ffd0d6}
.err{color:#d0213a;font-weight:700;min-height:1.2em}.m{color:#6b7c93;font-size:14px}[hidden]{display:none!important}
.fr{display:block;margin:10px auto;border:3px solid #12233d;border-radius:14px;background:#000;width:100%;height:70vh}.fr.ph{width:375px;max-width:100%;height:667px;max-height:75vh}
.rv{border-left:4px solid #0a6cff;padding:6px 10px;margin:8px 0;background:#f7faff}
</style></head><body><div class="w">
<div class="c"><h1>UNTILS Review Portal</h1><div class="row" id="bar" hidden><span id="who" class="m"></span><span class="b" id="role"></span><button class="g" id="out">Log out</button></div></div>
<div class="c" id="login"><h2>Staff sign in</h2><div id="s1"><input type="email" id="em" placeholder="Your email"><div class="row"><button id="send">SEND CODE</button></div></div>
<div id="s2" hidden><p class="m">Enter the code sent to your email.</p><input type="text" id="cd" inputmode="numeric" maxlength="10" placeholder="Code"><div class="row"><button id="ver">VERIFY</button></div></div><div class="err" id="le"></div></div>
<div class="c" id="deny" hidden><h2>No access</h2><p>This account is not on the review team. Ask the leader to add your email.</p></div>
<div id="app" hidden><div class="c"><div class="row"><button class="g" data-t="pending">Pending</button><button class="g" data-t="done">Decided</button><button class="g" data-t="team" id="tt" hidden>Team</button></div><div id="list"></div></div>
<div class="c" id="det" hidden></div></div>
</div><script src="/assets/js/auth.js?v=8"></script><script src="/assets/js/admin.v3.js"></script></body></html>
